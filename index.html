<!DOCTYPE html>
<html lang="en" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SWIA | So What, It's Art.</title>
    
    <!-- Tailwind CSS for structural styling and responsive utilities -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Three.js for the 2027-style interactive galaxy dust -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <!-- Google Fonts: Inter for ultra-clean, minimalist typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100;200;300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Base Reset & Typography */
        * { cursor: none !important; }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #020204;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            /* Hide scrollbar for seamless look */
            scrollbar-width: none; 
            -ms-overflow-style: none;
        }
        body::-webkit-scrollbar {
            display: none;
        }

        /* 
         * The Aurora Background 
         * A slow-shifting, deep abyssal gradient.
         */
        .aurora-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -2;
            background: linear-gradient(
                -45deg, 
                #05020a, /* Deep Void Black */
                #0a0518, /* Abyssal Purple */
                #020813, /* Midnight Blue */
                #11041c  /* Dark Nebula */
            );
            background-size: 400% 400%;
            animation: shiftAurora 25s ease infinite;
        }

        @keyframes shiftAurora {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            top: 0; left: 0;
            width: 8px; height: 8px;
            background: white;
            border-radius: 50%;
            pointer-events: none;
            z-index: 9999;
            transform: translate(-50%, -50%);
            transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1), background-color 0.3s, border 0.3s;
            mix-blend-mode: difference;
            will-change: transform, width, height;
        }
        .cursor-follower {
            position: fixed;
            top: 0; left: 0;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(138,43,226,0.12) 0%, rgba(2,2,4,0) 65%);
            border-radius: 50%;
            pointer-events: none;
            z-index: -1;
            transform: translate(-50%, -50%);
            will-change: transform;
        }

        /* Logo Kerning */
        .logo-text {
            letter-spacing: -0.07em; /* Extremely tight, no overlap */
            font-weight: 400;
        }

        /* Fade-in Animation */
        .fade-in {
            animation: fadeIn 2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Three.js Canvas Container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: -1;
            pointer-events: none; /* Let clicks pass through to UI */
        }

        /* 
         * Glassmorphism Utilities
         * Achieving the 'floaty' borderless glow effect.
         */
        .glass-panel {
            background: rgba(255, 255, 255, 0.01);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.04);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-panel:hover {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5),
                        0 0 40px rgba(138, 43, 226, 0.15) inset; /* Subtle purple glow */
            transform: translateY(-5px);
        }

        .glass-nav {
            background: linear-gradient(to bottom, rgba(2,2,4,0.8) 0%, rgba(2,2,4,0) 100%);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }

        /* Abstract Art Placeholders (CSS Art) */
        .art-void {
            background: radial-gradient(circle at center, #1a1a2e 0%, #000000 70%);
            box-shadow: inset 0 0 50px rgba(0,0,0,1);
        }
        .art-pixel {
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050505;
        }
        .art-pixel::after {
            content: '';
            width: 4px;
            height: 4px;
            background: #ffffff;
            box-shadow: 0 0 20px 5px rgba(255,255,255,0.8);
        }
        .art-anxiety {
            background: repeating-linear-gradient(
                45deg,
                #000000,
                #000000 10px,
                #110a1f 10px,
                #110a1f 20px
            );
            animation: pulseAnxiety 2s infinite alternate;
        }

        @keyframes pulseAnxiety {
            0% { filter: contrast(1) brightness(1); }
            100% { filter: contrast(1.5) brightness(0.8); }
        }

        /* Typography tweaks for that soul-dropping scale */
        .title-drop {
            letter-spacing: -0.05em;
            line-height: 0.9;
        }
        .tracking-widest-xl {
            letter-spacing: 0.3em;
        }
        
        /* Subtle text glow */
        .text-glow {
            text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body class="text-white selection:bg-purple-900 selection:text-white">

    <!-- The Environment -->
    <div class="custom-cursor" id="cursor"></div>
    <div class="cursor-follower" id="cursor-follower"></div>
    <div class="aurora-bg"></div>
    <div id="canvas-container"></div>

    <!-- Navigation -->
    <nav class="glass-nav fixed top-0 w-full z-50 px-6 py-8 md:px-16 flex justify-between items-center fade-in" style="animation-delay: 0.2s;">
        <div class="logo-text text-3xl opacity-90 hover:opacity-100 transition-opacity duration-500">
            swia
        </div>
        <div class="flex gap-10 text-sm font-light tracking-wide opacity-50">
            <a href="#" class="hover:opacity-100 hover:text-white transition-all duration-300">manifesto</a>
            <a href="#" class="hover:opacity-100 hover:text-white transition-all duration-300">collection</a>
        </div>
    </nav>

    <!-- Main Content wrapper -->
    <main class="relative z-10 min-h-screen flex flex-col items-center justify-center pt-32 pb-24 px-6 md:px-16">
        
        <!-- Hero Section -->
        <header class="w-full max-w-7xl mx-auto flex flex-col items-start justify-center min-h-[85vh] text-left mb-32 fade-in" style="animation-delay: 0.5s;">
            <div class="inline-block px-5 py-2 rounded-full border border-white/10 bg-white/5 backdrop-blur-md mb-10">
                <span class="text-xs font-light tracking-widest uppercase text-white/50">Curated Satire</span>
            </div>
            <h1 class="text-6xl md:text-8xl lg:text-[10rem] font-thin tracking-tighter leading-[0.85] text-white mb-10">
                art you<br>
                <span class="text-white/30 italic font-light">cannot buy.</span>
            </h1>
            <p class="max-w-2xl text-xl md:text-2xl font-light text-white/40 leading-relaxed mb-14">
                meaningless aesthetics for a post-meaning world. The So What, It's Art Collection.<br><br>
                <span class="text-white/70">Priceless, because it is literally not for sale.</span>
            </p>
            
            <!-- Floaty CTA Button -->
            <button class="relative group px-12 py-5 overflow-hidden rounded-full bg-transparent border border-white/20 backdrop-blur-md transition-all duration-500 hover:bg-white/10 hover:border-white/40">
                <span class="relative z-10 text-sm font-light tracking-widest uppercase text-white/70 group-hover:text-white transition-colors duration-500">
                    Explore the Absurd
                </span>
                <!-- Inner button glow -->
                <div class="absolute inset-0 -z-10 bg-gradient-to-r from-purple-600/0 via-purple-500/10 to-blue-600/0 opacity-0 group-hover:opacity-100 transition-opacity duration-700 blur-xl"></div>
            </button>
        </header>

    </main>

    <!-- Interactive 3D Galaxy Script -->
    <script>
        window.onload = function () {
            // Three.js Scene Setup
            const container = document.getElementById('canvas-container');
            const scene = new THREE.Scene();
            
            // Add a subtle fog to blend particles into the distance
            scene.fog = new THREE.FogExp2(0x020204, 0.001);

            const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 100;

            const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); // Optimize for high DPI without crashing performance
            container.appendChild(renderer.domElement);

            // Particles Setup
            const particleCount = 2000;
            const geometry = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);

            // Create a mix of subtle purples, blues, and pure whites for the stars
            const colorPalette = [
                new THREE.Color(0xffffff), // White
                new THREE.Color(0x8a2be2), // BlueViolet
                new THREE.Color(0x4169e1), // RoyalBlue
                new THREE.Color(0x2d1b4e)  /* Deep Purple */
            ];

            for (let i = 0; i < particleCount * 3; i += 3) {
                // Spread particles across a wide space
                positions[i] = (Math.random() - 0.5) * 400;     // x
                positions[i + 1] = (Math.random() - 0.5) * 400; // y
                positions[i + 2] = (Math.random() - 0.5) * 400; // z

                // Assign random colors from palette
                const randomColor = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                colors[i] = randomColor.r;
                colors[i + 1] = randomColor.g;
                colors[i + 2] = randomColor.b;
            }

            geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            // Material for glowing dust
            const material = new THREE.PointsMaterial({
                size: 0.8,
                vertexColors: true,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending, // Gives that glowing light effect
                depthWrite: false
            });

            const particles = new THREE.Points(geometry, material);
            scene.add(particles);

            // Mouse Interaction Variables
            let mouseX = 0;
            let mouseY = 0;
            let targetX = 0;
            let targetY = 0;
            const windowHalfX = window.innerWidth / 2;
            const windowHalfY = window.innerHeight / 2;

            // Custom Cursor Logic
            const cursor = document.getElementById('cursor');
            const cursorFollower = document.getElementById('cursor-follower');
            let clientX = windowHalfX;
            let clientY = windowHalfY;
            let followerX = windowHalfX;
            let followerY = windowHalfY;

            // Track mouse movement
            document.addEventListener('mousemove', (event) => {
                mouseX = (event.clientX - windowHalfX);
                mouseY = (event.clientY - windowHalfY);
                
                clientX = event.clientX;
                clientY = event.clientY;
                
                // Instantly move the small dot
                cursor.style.transform = `translate(${clientX}px, ${clientY}px) translate(-50%, -50%)`;
            });
            
            // Track touch movement for iPad compatibility
            document.addEventListener('touchmove', (event) => {
                if(event.touches.length > 0) {
                    mouseX = (event.touches[0].clientX - windowHalfX);
                    mouseY = (event.touches[0].clientY - windowHalfY);
                    
                    clientX = event.touches[0].clientX;
                    clientY = event.touches[0].clientY;
                    
                    cursor.style.transform = `translate(${clientX}px, ${clientY}px) translate(-50%, -50%)`;
                }
            });

            // Hover state for custom cursor
            const interactiveElements = document.querySelectorAll('a, button, .glass-panel, .logo-text');
            interactiveElements.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    cursor.style.width = '45px';
                    cursor.style.height = '45px';
                    cursor.style.backgroundColor = 'transparent';
                    cursor.style.border = '1px solid rgba(255,255,255,0.4)';
                });
                el.addEventListener('mouseleave', () => {
                    cursor.style.width = '8px';
                    cursor.style.height = '8px';
                    cursor.style.backgroundColor = 'white';
                    cursor.style.border = 'none';
                });
            });

            // Animation Loop
            const clock = new THREE.Clock();

            function animate() {
                requestAnimationFrame(animate);
                
                const elapsedTime = clock.getElapsedTime();

                // Smooth cursor follower (Lerp)
                followerX += (clientX - followerX) * 0.08;
                followerY += (clientY - followerY) * 0.08;
                cursorFollower.style.transform = `translate(${followerX}px, ${followerY}px) translate(-50%, -50%)`;

                // Slow, majestic rotation of the entire galaxy
                particles.rotation.y = elapsedTime * 0.02;
                particles.rotation.z = elapsedTime * 0.01;

                // Smooth camera follow based on mouse (Parallax effect)
                targetX = mouseX * 0.05;
                targetY = mouseY * 0.05;
                
                camera.position.x += (targetX - camera.position.x) * 0.02;
                camera.position.y += (-targetY - camera.position.y) * 0.02;
                camera.lookAt(scene.position);

                renderer.render(scene, camera);
            }

            // Handle Window Resize
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // Start Animation
            animate();
        };
    </script>
</body>
</html>
